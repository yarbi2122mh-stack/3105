name: Build 3105 IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-13
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: Build IPA
      run: |
        xcodebuild -project ThreeOneOSFive.xcodeproj \
          -scheme 3105 \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          DEVELOPMENT_TEAM="" \
          build

    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -r build/Release-iphoneos/3105.app Payload/
        zip -r 3105-unsigned.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: 3105-unsigned-ipa
        path: 3105-unsigned.ipa
